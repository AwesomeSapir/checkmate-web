<input
  type="file"
  accept="image/*"
  capture="environment"
  (change)="fileChangeEvent($event)"
/>

<div #cropContainer class="crop-wrapper">
<img
  #imagePreview
  *ngIf="previewImage"
  [src]="previewImage"
  (load)="startCrop()"
  alt="Selected receipt"
  class="preview-image"
/>
</div>

<button
  mat-flat-button
  color="accent"
  (click)="renderAndClose()"
  [disabled]="!previewImage"
>
  <mat-icon>cloud_upload</mat-icon>
  Submit
</button>
